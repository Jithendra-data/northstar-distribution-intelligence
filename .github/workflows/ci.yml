name: Project quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run small pipeline smoke test
        run: python -m etl.run_pipeline --orders 1000 --purchase-orders 250
      - name: Validate dashboard JSON
        run: python -m json.tool web/data/dashboard.json > /tmp/dashboard.json
      - name: Validate JavaScript syntax
        run: node --check web/js/app.js
